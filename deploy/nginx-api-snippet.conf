# Tambahkan blok ini di dalam server{} yang sudah dipakai xray/nginx.sh,
# ATAU buat server block baru khusus subdomain panel, cth: panel.contoh-domain.com

location /api/ {
    alias /var/www/vpn-api/;
    index index.php;
    try_files $uri $uri/ /api/index.php?$query_string;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # sesuaikan versi PHP-nya
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}

# Panel HTML (variant-b-topbar-grid.html) taruh di /var/www/vpn-panel/
# lalu tambahkan location terpisah atau server block sendiri untuk itu.
